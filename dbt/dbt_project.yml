# dbt project of the lab (spec 2026-10-30-dbt-elt, section 6.5). The same models run on
# each catalog; the target (profiles.yml) selects the catalog.
name: lab_tpch
version: "1.0.0"
config-version: 2
profile: lab

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
target-path: target
clean-targets: [target]

models:
  lab_tpch:
    +file_format: iceberg
    staging:
      +schema: tpch_staging
      # Tables, not views: Polaris does not delete the metadata file of a dropped view, and
      # on AWS the lab role cannot delete it (NOTES F7, S4).
      +materialized: table
    marts:
      +schema: tpch_marts
      +materialized: table
