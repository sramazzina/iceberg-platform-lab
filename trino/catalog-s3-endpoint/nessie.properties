# S3-compatible storage (S3_ENDPOINT is set): the Trino S3 file system does not read the
# endpoint that the catalog gives to clients. Keys of the RustFS user lab.
s3.endpoint=${ENV:S3_ENDPOINT}
s3.path-style-access=${ENV:S3_PATH_STYLE_ACCESS}
s3.aws-access-key=${ENV:AWS_ACCESS_KEY_ID}
s3.aws-secret-key=${ENV:AWS_SECRET_ACCESS_KEY}
