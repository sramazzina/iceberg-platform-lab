# Catalog nessie: Nessie Iceberg REST endpoint, branch main (the same endpoint as Spark).
# Trino reads and writes the files with the VM instance profile (AWS default chain).
connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://nessie:19120/iceberg/main
fs.s3.enabled=true
s3.region=${ENV:AWS_REGION}
