# Catalog polaris: Polaris catalog lab_catalog. Trino authenticates as trino_user (never
# root) and reads and writes with the S3 credentials that Polaris vends.
# The entrypoint exports POLARIS_TRINO_CLIENT_ID and POLARIS_TRINO_CLIENT_SECRET from
# secrets/trino_user.env; Trino replaces ${ENV:...} at startup.
connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://polaris:8181/api/catalog
iceberg.rest-catalog.warehouse=lab_catalog
iceberg.rest-catalog.security=OAUTH2
iceberg.rest-catalog.oauth2.credential=${ENV:POLARIS_TRINO_CLIENT_ID}:${ENV:POLARIS_TRINO_CLIENT_SECRET}
iceberg.rest-catalog.oauth2.scope=PRINCIPAL_ROLE:ALL
iceberg.rest-catalog.oauth2.server-uri=http://polaris:8181/api/catalog/v1/oauth/tokens
iceberg.rest-catalog.vended-credentials-enabled=true
fs.s3.enabled=true
s3.region=${ENV:AWS_REGION}
