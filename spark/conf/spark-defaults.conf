# Spark defaults for the lab: the common part. The entrypoint appends the template of
# each catalog that is on (spark/conf/catalogs/<catalog>.conf).
spark.sql.extensions    org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.driver.memory     4g
# No Derby metastore_db: two spark-sql sessions must not collide.
spark.sql.catalogImplementation    in-memory
# The Spark UI must not show the catalog credentials.
spark.redaction.regex    (?i)secret|password|token|access[.]?key|credential
# Extra JDBC drivers (spec 2026-11-24-extra-jdbc-sources). Local mode: the driver JVM is the
# only JVM. An empty directory has no effect.
spark.driver.extraClassPath    /opt/lab-extra/jars/*
